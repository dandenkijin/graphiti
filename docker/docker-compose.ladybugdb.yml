services:
  ladybugdb-graphiti:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ladybugdb
      args:
        GRAPHITI_VERSION: latest
        BUILD_DATE: ${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        VCS_REF: ${VCS_REF:-local}
      # Add registry credentials if needed
      secrets:
        - docker_config
    network_mode: host  # Use host network to access localhost services
    env_file:
      - ../.env
    environment:
      - GRAPH_DB_PATH=${GRAPH_DB_PATH:-/data/graph.db}  # LadybugDB with Kuzu backend path
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://localhost:11434/v1}  # Local Ollama endpoint
      - MODEL_NAME=${MODEL_NAME:-huihui_ai/qwen3.5-abliterated:9b}  # LLM model name (forced)
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-qwen3-embedding:0.6b}  # Embedding model name (forced)
      - OLLAMA_SCHEMA=${OLLAMA_SCHEMA:-true}  # Ollama schema flag
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - UV_NO_CACHE=1  # Disable uv cache completely to avoid permission issues
    volumes:
      - ladybugdb_data:/data  # Use Docker volume to avoid permission issues
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  docker_config:
    file: ${HOME}/.docker/config.json

volumes:
  ladybugdb_data:
    driver: local

