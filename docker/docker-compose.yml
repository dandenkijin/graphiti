version: '3.8'
services:
  graphiti:
    build:
      context: .  # Your Graphiti app dir with requirements.txt including graphiti-core[kuzu]
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Graphiti API
    environment:
      - KUZU_DB=/data/graphiti.kuzu  # Persistent DB path
      - OPENAI_API_KEY=your_key  # Or other LLMs
    volumes:
      - kuzu_data:/data  # Persist Kùzu DB file
    restart: unless-stopped

volumes:
  kuzu_data:
